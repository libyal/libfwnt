[project]
description: "libfwnt is a library for Windows NT data types."
name: "libfwnt"
status: "alpha"
year_of_creation: "2009"
documentation_url: "https://github.com/libyal/libfwnt/tree/main/documentation"
features: ["debug_output", "ossfuzz", "python_bindings"]

[library]
description: "Library to support common Windows NT specific formats"
public_types: ["access_control_entry", "access_control_list", "security_descriptor", "security_identifier"]
tests: ["access_control_entry", "access_control_list", "bit_stream", "error", "huffman_tree", "lznt1", "lzx", "lzxpress", "notify", "security_descriptor", "security_identifier", "support"]

[python_module]
tests: ["access_control_entry", "access_control_list", "lznt1", "lzx", "lzxpress", "security_descriptor", "security_identifier", "support"]

